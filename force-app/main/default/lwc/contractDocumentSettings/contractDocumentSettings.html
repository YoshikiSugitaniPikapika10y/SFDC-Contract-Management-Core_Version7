<template>
  <lightning-card title={settingsPageTitle} icon-name="standard:settings">
    <div class="actions slds-p-horizontal_medium">
      <lightning-button label="再読込" onclick={load} disabled={loading}></lightning-button>
      <template lwc:if={canManageOrgSettings}>
        <lightning-button variant="brand" label="保存" onclick={handleSave} disabled={loading}></lightning-button>
      </template>
    </div>

    <template lwc:if={loading}>
      <lightning-spinner alternative-text="処理中"></lightning-spinner>
    </template>

    <div class="slds-p-around_medium">
      <!-- 仕様: Core 第11.6節 -->
      <section>
        <h2 class="slds-text-heading_small">1. 権限と共有</h2>
        <p class="slds-text-body_regular section-lead">権限とレコードの共有</p>
        <div class="setting-row">
          <span class="row-num">行 1.1</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">権限セット</span>
          <div class="row-control">
            <a href={permissionSetsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>権限セット</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">業務で使う操作の可否をユーザに付けます。金額は変わりません。付け外しは操作ログに書きません。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 1.2</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">権限セットグループ</span>
          <div class="row-control">
            <a href={permissionSetGroupsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>権限セットグループ</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">複数の権限をまとめてユーザに付けます。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 1.3</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">共有設定</span>
          <div class="row-control">
            <a href={sharingUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>共有設定</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">レコードを誰が見られるかを決めます。一覧に出る範囲もここで変わります。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">2. 商品</h2>
        <p class="slds-text-body_regular section-lead">契約で使う商品</p>
        <div class="setting-row">
          <span class="row-num">行 2.1</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">商品</span>
          <div class="row-control">
            <a href={productsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>商品</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">契約で使う商品を管理します。新しい見積行の初期値になります。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">3. 帳票</h2>
        <p class="slds-text-body_regular section-lead">見積書・請求書の3択、会社情報。本体はリンク先。既定はカタログ</p>
        <div class="setting-row">
          <span class="row-num">行 3.1</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">見積書</span>
          <div class="row-control">
            <lightning-combobox name="estimateSendMode" label="見積書" variant="label-hidden" value={settings.estimateSendMode} options={sendModeOptions} onchange={handleChange} required></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積書PDFの発行、見積メール、ウィザードの見積書セクションの有無に使います。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.2</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">請求書</span>
          <div class="row-control">
            <lightning-combobox name="invoiceSendMode" label="請求書" variant="label-hidden" value={settings.invoiceSendMode} options={sendModeOptions} onchange={handleChange} required></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">請求書PDFの発行とメールに使います。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.3</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">会社名</span>
          <div class="row-control">
            <lightning-input name="companyName" label="会社名" variant="label-hidden" value={settings.companyName} maxlength="255" required={companyNameRequired} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積・請求のPDFに出す会社名です。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.4</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">住所</span>
          <div class="row-control">
            <lightning-textarea name="address" label="住所" variant="label-hidden" value={settings.address} maxlength="255" required={addressRequired} onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積・請求のPDFに出す住所です。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.5</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">登録番号</span>
          <div class="row-control">
            <lightning-input name="invoiceRegistrationNumber" label="登録番号" variant="label-hidden" value={settings.invoiceRegistrationNumber} maxlength="80" required={invoiceCompanyFieldsRequired} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">請求PDFに出す登録番号です。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.6</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">振込先</span>
          <div class="row-control">
            <lightning-textarea name="bankTransferInfo" label="振込先" variant="label-hidden" value={settings.bankTransferInfo} required={invoiceCompanyFieldsRequired} onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">請求PDFに出す振込先です。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.7</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">帳票フッター</span>
          <div class="row-control">
            <lightning-textarea name="documentFooter" label="帳票フッター" variant="label-hidden" value={settings.documentFooter} onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積・請求のPDFのフッターに出します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.8</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">プライバシーポリシーURL</span>
          <div class="row-control">
            <lightning-input type="url" name="privacyPolicyUrl" label="プライバシーポリシーURL" variant="label-hidden" value={settings.privacyPolicyUrl} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積・請求のPDFに出します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.9</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">帳票カタログ</span>
          <div class="row-control">
            <a href={documentCatalogUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>帳票カタログ</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">発行する帳票の候補です。有効な既定が1つなら、発行・送付の最初の選択になります。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 3.10</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">見積備考</span>
          <div class="row-control">
            <a href={estimateNotesUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>見積備考</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">ウィザードの備考の初期値です。自由文だけでも保存できます。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">4. 送付</h2>
        <p class="slds-text-body_regular section-lead">組織送信元。本体はリンク先。既定はカタログ</p>
        <div class="setting-row">
          <span class="row-num">行 4.1</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">見積用組織送信元</span>
          <div class="row-control">
            <lightning-combobox name="estimateOrgWideEmailAddress" label="見積用組織送信元" variant="label-hidden" value={settings.estimateOrgWideEmailAddress} options={orgWideEmailAddresses} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積の差出人は、組織か自分かを送れます。ここは組織を選んだときのアドレスです。空でも自分から送れます。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 4.2</span>
          <span class="slds-badge need need-conditional">条件付き必須</span>
          <span class="row-label">請求用組織送信元</span>
          <div class="row-control">
            <lightning-combobox name="invoiceOrgWideEmailAddress" label="請求用組織送信元" variant="label-hidden" value={settings.invoiceOrgWideEmailAddress} options={orgWideEmailAddresses} required={invoiceOrgWideRequired} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">請求の差出人は組織だけです。ここが差出人になります。空では送れません。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 4.3</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">送付メールカタログ</span>
          <div class="row-control">
            <a href={emailCatalogUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>送付メールカタログ</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">送るメールの候補です。有効な既定が1つなら、送付の最初の選択になります。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">5. 契約</h2>
        <p class="slds-text-body_regular section-lead">継続課金の既定サイクル数、見積有効期間、更新商談スイッチ</p>
        <div class="setting-row">
          <span class="row-num">行 5.1</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">継続課金の既定サイクル数</span>
          <div class="row-control">
            <lightning-input type="number" name="defaultMonthlyCycles" label="継続課金の既定サイクル数" variant="label-hidden" value={settings.defaultMonthlyCycles} min="1" max="36" step="1" required onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">Newで終了日が空のとき、手動Renewの初期終了日、自動Renew見積の延長の初期値に使います。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 5.2</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">見積有効期間</span>
          <div class="row-control">
            <lightning-input type="number" name="estimateValidMonths" label="見積有効期間" variant="label-hidden" value={settings.estimateValidMonths} min="1" max="12" step="1" required onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">ウィザードが見積日から有効期限の初期値を付けるときの暦月数です。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 5.3</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">更新商談スイッチ</span>
          <div class="row-control">
            <lightning-input type="checkbox" name="renewOpportunityEnabled" label="更新商談スイッチ" variant="label-hidden" checked={settings.renewOpportunityEnabled} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">ONのときだけ、受注画面のチェックと件数の増減が動きます。OFFなら作成要求は拒否し、自動Renew見積も作りません。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">6. 追加項目</h2>
        <p class="slds-text-body_regular section-lead">ウィザード・請求操作の追加項目とコピー。検証は任意</p>
        <div class="setting-row">
          <span class="row-num">行 6.1</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">見積ウィザード追加項目</span>
          <div class="row-control">
            <a href={estimateWizardFieldsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>見積ウィザード追加項目</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積Step 2に出すカスタム項目、必須、初期値を指定します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 6.2</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">受注ウィザード追加項目</span>
          <div class="row-control">
            <a href={orderWizardFieldsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>受注ウィザード追加項目</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">受注、受注済みの見積編集、差し戻しに出すカスタム項目を指定します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 6.3</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">請求操作追加項目</span>
          <div class="row-control">
            <a href={invoiceOpsFieldsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>請求操作追加項目</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">請求情報編集、入出金登録、仕訳に出すカスタム項目を指定します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 6.4</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">追加項目コピー</span>
          <div class="row-control">
            <a href={fieldCopyUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>追加項目コピー</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">作成時、空欄の項目だけコピーします。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 6.5</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">コピー設定を検証</span>
          <div class="row-control">
            <template lwc:if={canManageOrgSettings}>
              <lightning-button label="コピー設定を検証" onclick={handleValidateFieldCopy} disabled={loading}></lightning-button>
            </template>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">コピー定義が壊れていないかを、保存とは別に確認します。定義はここでは直しません。方針を固定したあとも実行できます。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">7. 金額計算</h2>
        <p class="slds-text-body_regular section-lead">丸め・按分。変更しても保存済みは再計算しない</p>
        <div class="setting-row">
          <span class="row-num">行 7.1</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">丸め・按分</span>
          <div class="row-control">
            <div class="amount-sub">
              <span>税額丸め</span>
              <lightning-combobox name="taxRoundingMode" label="税額丸め" variant="label-hidden" value={settings.taxRoundingMode} options={taxRoundingModeOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <template for:each={amountReadonlyItems} for:item="item">
              <div key={item.key} class="amount-sub">
                <span>{item.label}</span>
                <span class="readonly-text">{item.text}</span>
              </div>
            </template>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">見積税額、請求ヘッダ税、配分、入出金の初期配分、月次バケット金額の計算に使います。</span>
          </span>
          <div class="row-note">
            <span class="slds-badge badge-caution">注意</span>
            <span class="row-note-text">{amountCautionText}</span>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 7.2</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">金額計算</span>
          <div class="row-control">
            <a href={amountCalculationUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>金額計算</a>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">丸め・按分の会社設定の行を開きます。</span>
          </span>
        </div>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">8. Accounting</h2>
        <p class="slds-text-body_regular section-lead">利用有無と方針。未固定なら変更可。固定後は参照専用。マスタはリンク先</p>
        <div class="setting-row">
          <span class="row-num">行 8.1</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">仕訳機能の利用有無</span>
          <div class="row-control">
            <lightning-input type="checkbox" name="accountingEnabled" label="仕訳機能の利用有無" variant="label-hidden" checked={settings.accountingEnabled} disabled={policyFrozen} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">ONなら仕訳生成、会計タグ、検収終了日の標準画面が動きます。OFFでも請求と入出金は動きます。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 8.2</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">売上計上方針</span>
          <div class="row-control">
            <lightning-combobox name="revenueRecognitionBasis" label="売上計上方針" variant="label-hidden" value={settings.revenueRecognitionBasis} options={revenueRecognitionBasisOptions} disabled={policyFrozen} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">仕訳で売掛と前受が立つ時点を決めます。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 8.3</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">税認識方針</span>
          <div class="row-control">
            <lightning-combobox name="taxRecognitionTiming" label="税認識方針" variant="label-hidden" value={settings.taxRecognitionTiming} options={taxRecognitionTimingOptions} disabled={policyFrozen} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">消費税の仕訳を立てる時点を決めます。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 8.4</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">月次バケットの刻み方</span>
          <div class="row-control">
            <lightning-combobox name="monthlyBucketMethod" label="月次バケットの刻み方" variant="label-hidden" value={settings.monthlyBucketMethod} options={monthlyBucketMethodOptions} disabled={policyFrozen} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">月次売上の期間の切れ方です。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 8.5</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">月次計上の計上日位置</span>
          <div class="row-control">
            <lightning-combobox name="monthlyRecognitionDatePosition" label="月次計上の計上日位置" variant="label-hidden" value={settings.monthlyRecognitionDatePosition} options={monthlyRecognitionDatePositionOptions} disabled={policyFrozen} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">月次売上仕訳の計上日を決めます。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-num">行 8.6</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">端数の寄せ先</span>
          <div class="row-control">
            <lightning-combobox name="roundingTargetBucket" label="端数の寄せ先" variant="label-hidden" value={settings.roundingTargetBucket} options={roundingTargetBucketOptions} disabled={policyFrozen} onchange={handleChange}></lightning-combobox>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">月次売上と税配分の端数を、どのバケットへ入れるかを決めます。</span>
          </span>
          <div class="row-note">
            <span class={freezePolicyBadgeClass}>{freezePolicyBadge}</span>
            <template lwc:if={freezePolicyHint}>
              <span class="row-note-text">{freezePolicyHint}</span>
            </template>
          </div>
        </div>
        <template lwc:if={showFrozenBy}>
          <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
            <lightning-input class="slds-col slds-size_1-of-1 slds-large-size_1-of-2" label="固定者" value={settings.frozenByName} disabled></lightning-input>
            <lightning-input class="slds-col slds-size_1-of-1 slds-large-size_1-of-2" label="固定日時" value={settings.frozenAtLabel} disabled></lightning-input>
          </div>
        </template>
        <template lwc:if={showAccountingMasterLinks}>
          <div class="setting-row">
            <span class="row-num">行 8.7</span>
            <span class="slds-badge need need-optional">任意</span>
            <span class="row-label">勘定科目</span>
            <div class="row-control">
              <a href={glAccountsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>勘定科目</a>
            </div>
            <span class="help-wrap">
              <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
              <span class="help-tip" role="tooltip">仕訳で使う実勘定科目です。</span>
            </span>
          </div>
          <div class="setting-row">
            <span class="row-num">行 8.8</span>
            <span class="slds-badge need need-optional">任意</span>
            <span class="row-label">条件セット</span>
            <div class="row-control">
              <a href={conditionSetsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>条件セット</a>
            </div>
            <span class="help-wrap">
              <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
              <span class="help-tip" role="tooltip">割当を条件で分けるときに使います。</span>
            </span>
          </div>
          <div class="setting-row">
            <span class="row-num">行 8.9</span>
            <span class="slds-badge need need-optional">任意</span>
            <span class="row-label">割当</span>
            <div class="row-control">
              <a href={accountMapsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>割当</a>
            </div>
            <span class="help-wrap">
              <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
              <span class="help-tip" role="tooltip">スロットから実勘定へつなぎます。</span>
            </span>
          </div>
          <div class="setting-row">
            <span class="row-num">行 8.10</span>
            <span class="slds-badge need need-optional">任意</span>
            <span class="row-label">タグルール</span>
            <div class="row-control">
              <a href={tagRulesUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>タグルール</a>
            </div>
            <span class="help-wrap">
              <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
              <span class="help-tip" role="tooltip">請求書単位のタグ結果を付けます。</span>
            </span>
          </div>
          <div class="setting-row">
            <span class="row-num">行 8.11</span>
            <span class="slds-badge need need-optional">任意</span>
            <span class="row-label">手動仕訳</span>
            <div class="row-control">
              <a href={manualJournalsUrl} target="_blank" rel="noopener" onclick={handleOpenLink}>手動仕訳</a>
            </div>
            <span class="help-wrap">
              <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
              <span class="help-tip" role="tooltip">手動仕訳のメニューです。</span>
            </span>
          </div>
        </template>
      </section>

      <section class="slds-m-top_large">
        <h2 class="slds-text-heading_small">9. 入力とロック</h2>
        <p class="slds-text-body_regular section-lead">入力強制とロック除外項目</p>
        <div class="setting-row">
          <span class="row-num">行 9.1</span>
          <span class="slds-badge need need-required">必須</span>
          <span class="row-label">カスタム入力規則をON</span>
          <div class="row-control">
            <lightning-input type="checkbox" name="validationEnforce" label="カスタム入力規則をON" variant="label-hidden" checked={settings.validationEnforce} onchange={handleChange}></lightning-input>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">この設定を参照する顧客の入力規則だけを、導入後から効かせます。パッケージ標準のテストクラスを回すときは、OFFにして回します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 9.2</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">請求ロック除外項目</span>
          <div class="row-control">
            <lightning-textarea name="lockExemptFieldApiNames" label="請求ロック除外項目" variant="label-hidden" value={settings.lockExemptFieldApiNames} maxlength="255" onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">確定後に人が直せるカスタム項目を指定します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 9.3</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">入出金ロック除外項目</span>
          <div class="row-control">
            <lightning-textarea name="paymentLockExemptFieldApiNames" label="入出金ロック除外項目" variant="label-hidden" value={settings.paymentLockExemptFieldApiNames} maxlength="255" onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">登録後に人が直せるカスタム項目を指定します。</span>
          </span>
        </div>
        <div class="setting-row">
          <span class="row-num">行 9.4</span>
          <span class="slds-badge need need-optional">任意</span>
          <span class="row-label">仕訳ロック除外項目</span>
          <div class="row-control">
            <lightning-textarea name="journalLockExemptFieldApiNames" label="仕訳ロック除外項目" variant="label-hidden" value={settings.journalLockExemptFieldApiNames} maxlength="255" onchange={handleChange}></lightning-textarea>
          </div>
          <span class="help-wrap">
            <button type="button" class="help-bang" aria-label="ヘルプ">!</button>
            <span class="help-tip" role="tooltip">Lock後に人が直せるカスタム項目を指定します。</span>
          </span>
        </div>
      </section>
    </div>
  </lightning-card>
</template>
