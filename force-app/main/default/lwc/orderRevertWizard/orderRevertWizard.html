<template>
  <div class={pageClass}>
    <header class="confirm-header">
      <div class="confirm-heading">
        <span class="confirm-icon" aria-hidden="true">
          <lightning-icon
            icon-name="utility:undo"
            size="small"
            alternative-text="差し戻し"
          ></lightning-icon>
        </span>
        <div class="confirm-heading-text">
          <h1 class="confirm-title">差し戻し</h1>
          <p class="confirm-subtitle">Ordered を Estimate に戻します</p>
        </div>
      </div>
    </header>

    <main class="confirm-body">
      <template if:true={errorMessage}>
        <div class="alert alert_error" role="alert">{errorMessage}</div>
      </template>

      <template if:true={showBootstrapLoading}>
        <div class="loading">
          <lightning-spinner
            alternative-text="読み込み中"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template if:false={showBootstrapLoading}>
        <template if:true={hasContext}>
          <template if:true={showRevertBlockedNotice}>
            <div class="alert alert_warn" role="status">
              {revertBlockedReason}
            </div>
          </template>

          <template if:true={showManualAdjustmentNotice}>
            <div class="alert alert_warn" role="status">
              手動調整済みの請求があります。差し戻すと手動調整した請求も削除されます。
            </div>
          </template>

          <template if:true={canRevert}>
            <section class="confirm-card">
              <p class="confirm-lead">
                この契約履歴を Estimate に差し戻します。よろしいですか？
              </p>
              <ul class="confirm-list">
                <li>請求正本が削除されます</li>
                <li>契約期間明細が削除されます</li>
              </ul>
            </section>

            <template if:true={hasRenewOpportunity}>
              <section class="option-panel">
                <label class="checkbox">
                  <input
                    type="checkbox"
                    checked={deleteRenewOpportunity}
                    onchange={handleDeleteRenewOpportunityChange}
                    disabled={isBusy}
                  />
                  <span>更新商談を削除する</span>
                </label>
                <p class="option-help">
                  この受注から作成済みの更新商談があります。チェックを外すと商談は残します。
                </p>
              </section>
            </template>
          </template>
        </template>

        <template if:true={isSaving}>
          <div class="loading">
            <lightning-spinner
              alternative-text="差し戻し処理中"
              size="small"
            ></lightning-spinner>
          </div>
        </template>
      </template>
    </main>

    <footer class="confirm-footer">
      <button
        type="button"
        class="btn btn_secondary"
        onclick={handleClose}
        disabled={isBusy}
      >
        キャンセル
      </button>
      <button
        type="button"
        class="btn btn_danger"
        onclick={handleRevert}
        disabled={isRevertDisabled}
        title={revertBlockedReason}
      >
        Estimate に差し戻す
      </button>
    </footer>
  </div>
</template>
