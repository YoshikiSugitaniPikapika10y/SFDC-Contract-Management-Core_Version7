<template>
  <div class="confirm-page">
    <header class="confirm-header">
      <div class="confirm-heading-text">
        <h1 class="confirm-title">契約サービスを編集</h1>
      </div>
    </header>

    <main class="confirm-body">
      <template if:true={loading}>
        <div class="loading">
          <lightning-spinner alternative-text="読み込み中"></lightning-spinner>
        </div>
      </template>
      <template if:false={loading}>
        <template if:false={canEditService}>
          <div class="alert alert_error" role="alert">
            この操作の権限がありません。
          </div>
        </template>
        <template if:true={canEditService}>
          <section class="confirm-card">
            <lightning-input
              label="名前"
              value={name}
              required
              disabled={saving}
              onchange={handleNameChange}
            ></lightning-input>
            <!-- 仕様: Core 第3.4.1節・第4.3.3節。Newと同じ。他取引先検索ON/OFF。 -->
            <lightning-record-picker
              label="請求アカウント"
              object-api-name="BillingAccount__c"
              value={billingAccountId}
              required
              disabled={saving}
              filter={billingAccountFilter}
              onchange={handleBillingAccountChange}
            ></lightning-record-picker>
            <lightning-input
              type="checkbox"
              label="他の取引先の請求アカウントも検索する"
              checked={allowOtherAccountBilling}
              disabled={saving}
              onchange={handleAllowOtherAccountBillingChange}
            ></lightning-input>
            <lightning-input
              label="税率"
              type="number"
              value={taxPercent}
              required
              disabled={saving}
              onchange={handleTaxChange}
            ></lightning-input>
            <lightning-textarea
              label="備考"
              value={customerMemo}
              disabled={saving}
              onchange={handleMemoChange}
            ></lightning-textarea>
            <template if:true={hasCustomFields}>
              <c-estimate-wizard-custom-field-grid
                fields={customFieldInputs}
                field-target="service"
                disabled={saving}
                oncustomfieldchange={handleCustomFieldChange}
              ></c-estimate-wizard-custom-field-grid>
            </template>
            <template if:true={saving}>
              <p class="loading" role="status">
                <lightning-spinner
                  alternative-text="処理中"
                  size="small"
                ></lightning-spinner>
                処理中
              </p>
            </template>
          </section>
        </template>
      </template>
    </main>

    <footer class="confirm-footer">
      <button
        type="button"
        class="btn btn_secondary"
        disabled={saving}
        onclick={handleCancel}
      >
        キャンセル
      </button>
      <template if:true={canEditService}>
        <button
          type="button"
          class="btn btn_primary"
          disabled={saving}
          onclick={handleSave}
        >
          保存
        </button>
      </template>
    </footer>
  </div>
</template>
