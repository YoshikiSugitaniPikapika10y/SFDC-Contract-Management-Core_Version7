<template>
  <div class="confirm-page">
    <header class="confirm-header">
      <div class="confirm-heading">
        <span class="confirm-icon" aria-hidden="true">
          <lightning-icon
            icon-name="utility:list"
            size="small"
            alternative-text="見積操作"
          ></lightning-icon>
        </span>
        <div class="confirm-heading-text">
          <h1 class="confirm-title">見積操作</h1>
        </div>
      </div>
    </header>

    <main class="confirm-body">
      <template if:true={showActionList}>
        <template if:true={hasVisibleActions}>
          <ul class="confirm-list">
            <template for:each={visibleActions} for:item="row">
              <li key={row.key}>
                <button
                  type="button"
                  class="confirm-list-action"
                  data-key={row.key}
                  onclick={handleSelect}
                >
                  {row.label}
                </button>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasVisibleActions}>
          <p class="empty">対象がありません。</p>
        </template>
      </template>
      <template if:true={showIssueFrame}>
        <iframe
          class="issue-frame"
          title="見積書発行"
          src={issueFrameUrl}
        ></iframe>
      </template>
    </main>

    <footer class="confirm-footer">
      <button type="button" class="btn btn_secondary" onclick={handleCancel}>
        {cancelLabel}
      </button>
    </footer>
  </div>
</template>
