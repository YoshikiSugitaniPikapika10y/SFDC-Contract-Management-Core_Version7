<template>
  <section class="est-card">
    <div class="est-card-header">
      <h2 class="est-card-title">請求アカウント設定</h2>
      <!-- 仕様: Core 第5.2節。参照のみ。必須不足は正規編集画面へ誘導する。 -->
      <p class="est-card-desc">
        請求アカウントはこの画面では参照のみです。必須値が不足している場合は正規編集画面で設定してください。
      </p>
    </div>

    <div class="est-card-body">
      <template if:true={hasBillingAccount}>
        <section class="ba-bundle">
          <h3 class="ba-bundle-title">識別</h3>
          <div class="est-field-grid est-field-grid_identity">
            <div class="est-field">
              <span class="est-label">取引先</span>
              <div class="est-value">{billingCustomerAccountName}</div>
            </div>
            <div class="est-field">
              <span class="est-label">請求アカウント</span>
              <div class="est-value">{billingAccountName}</div>
            </div>
            <div class="est-field">
              <span class="est-label">キー</span>
              <div class="est-value">{billingAccountKey}</div>
            </div>
          </div>
        </section>

        <section class="ba-bundle">
          <h3 class="ba-bundle-title">送付</h3>
          <div class="est-field-grid est-field-grid_address">
            <template for:each={deliveryFieldInputs} for:item="field">
              <div key={field.key} class="est-field">
                <span class={field.labelClass}> {field.label} </span>
                <div class="est-value">{field.displayValue}</div>
              </div>
            </template>
          </div>
        </section>

        <section class="ba-bundle">
          <h3 class="ba-bundle-title">請求日ルール</h3>
          <p class="ba-bundle-help">{invoiceDateHelp}</p>
          <div class="est-field-grid est-field-grid_other">
            <template for:each={invoiceDateFieldInputs} for:item="field">
              <div key={field.key} class="est-field">
                <span class={field.labelClass}> {field.label} </span>
                <div class="est-value">{field.displayValue}</div>
              </div>
            </template>
          </div>
        </section>

        <section class="ba-bundle">
          <h3 class="ba-bundle-title">支払条件</h3>
          <p class="ba-bundle-help">{paymentTermHelp}</p>
          <div class="est-field-grid est-field-grid_other">
            <template for:each={paymentTermFieldInputs} for:item="field">
              <div key={field.key} class="est-field">
                <span class={field.labelClass}> {field.label} </span>
                <div class="est-value">{field.displayValue}</div>
              </div>
            </template>
          </div>
        </section>

        <template if:true={showFormalEditButton}>
          <div class="est-formal-edit slds-m-top_small">
            <lightning-button
              label="請求アカウントを編集"
              disabled={busy}
              onclick={handleOpenFormalEdit}
            ></lightning-button>
          </div>
        </template>
      </template>

      <template if:false={hasBillingAccount}>
        <div class="est-alert est-alert_error" role="alert">
          請求アカウントが未設定です。見積作成画面で請求アカウントを設定してから受注してください。
        </div>
      </template>
    </div>
  </section>
</template>
