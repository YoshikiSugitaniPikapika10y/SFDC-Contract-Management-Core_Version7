<template>
  <div class={pageClass} onwheel={handlePreviewWheel}>
    <header class="preview-header">
      <div>
        <h1 class="preview-title">請求ボード</h1>
      </div>
      <button
        type="button"
        class="btn btn_secondary"
        onclick={handleClose}
        disabled={isLoading}
      >
        閉じる
      </button>
    </header>

    <template if:true={errorMessage}>
      <div class="alert alert_error">
        <div>{errorMessage}</div>
        <template if:true={contentLoadFailed}>
          <div class="alert-reload">
            <button
              type="button"
              class="btn btn_secondary"
              onclick={handleContentReload}
            >
              再読み込み
            </button>
          </div>
        </template>
      </div>
    </template>

    <main class="preview-body">
      <template if:true={showBootstrapLoading}>
        <div class="loading loading_full">
          <lightning-spinner
            alternative-text="読み込み中"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template if:false={showBootstrapLoading}>
        <template if:true={hasPreview}>
          <div class="preview-table-area">
            <c-order-invoice-preview-table
              preview={invoicePreview}
              billing-account-options={billingAccountOptions}
              is-saving={isSaving}
              initial-version={tableInitialVersion}
              initial-invoice-id={tableInitialInvoiceId}
              contract-history-id={previewHistoryId}
              onsavelineamounts={handleSaveLineAmounts}
              onsaveacceptanceenddate={handleSaveAcceptanceEndDate}
              onsavebillingheader={handleSaveBillingHeader}
              onapplybillingaccountcontent={handleApplyBillingAccountContent}
              onsplitinvoice={handleSplitInvoice}
              onmovelines={handleMoveLines}
              onsplitlinesinplace={handleSplitLinesInPlace}
              onresetpostorder={handleResetPostOrder}
              oncancelconfirmed={handleCancelConfirmed}
              oninvoiceopscomplete={handleInvoiceOpsComplete}
            >
            </c-order-invoice-preview-table>
          </div>
        </template>
      </template>
    </main>
  </div>
</template>
