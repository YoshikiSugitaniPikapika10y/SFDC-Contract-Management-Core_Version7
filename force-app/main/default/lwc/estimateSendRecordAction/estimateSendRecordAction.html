<template>
  <div class="confirm-page">
    <header class="confirm-header">
      <div class="confirm-heading">
        <div class="confirm-heading-text">
          <h1 class="confirm-title">見積を送る</h1>
          <template if:true={estimate}>
            <p class="confirm-subtitle">{estimate.historyName}</p>
            <template if:true={estimate.title}>
              <p class="confirm-subtitle">{estimate.title}</p>
            </template>
          </template>
        </div>
      </div>
    </header>

    <main class="confirm-body">
      <template if:true={isLoading}>
        <div class="loading">
          <lightning-spinner
            alternative-text="読み込み中"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template if:true={estimate}>
        <section class="confirm-card">
          <div class="send-fields">
            <template if:true={showDocumentTemplatePicker}>
              <lightning-combobox
                label="帳票テンプレート"
                value={documentTemplateKey}
                options={documentTemplateOptions}
                required
                disabled={isSending}
                onchange={handleDocumentTemplateChange}
              ></lightning-combobox>
            </template>
            <lightning-combobox
              label="メールテンプレート"
              value={emailTemplateApiName}
              options={emailTemplateOptions}
              required
              disabled={isSending}
              onchange={handleEmailTemplateChange}
            ></lightning-combobox>
            <lightning-combobox
              name="fromChoice"
              label="From"
              value={fromChoice}
              options={fromChoiceOptions}
              disabled={isSending}
              onchange={handleFromChoiceChange}
            ></lightning-combobox>
            <p class="send-meta">{fromLabel}</p>
            <lightning-combobox
              name="attachmentId"
              label="添付"
              value={attachmentId}
              options={attachmentOptions}
              required
              disabled={isSending}
              onchange={handleAttachmentChange}
            ></lightning-combobox>
            <template if:true={showExistingFilePreview}>
              <p>
                <lightning-button
                  variant="base"
                  label="プレビュー"
                  onclick={handleExistingFilePreview}
                ></lightning-button>
              </p>
            </template>
            <lightning-input
              name="toAddresses"
              label="To"
              value={toAddresses}
              required
              read-only
            ></lightning-input>
            <lightning-input
              name="ccAddresses"
              label="Cc"
              value={ccAddresses}
              maxlength="255"
              disabled={isSending}
              onchange={handleDraftChange}
            ></lightning-input>
            <lightning-input
              name="bccAddresses"
              label="Bcc"
              value={bccAddresses}
              maxlength="255"
              disabled={isSending}
              onchange={handleDraftChange}
            ></lightning-input>
            <lightning-input
              name="subject"
              label="件名"
              value={subject}
              disabled={isSending}
              onchange={handleDraftChange}
            ></lightning-input>
            <lightning-textarea
              name="body"
              label="本文"
              value={body}
              disabled={isSending}
              onchange={handleDraftChange}
            ></lightning-textarea>
            <lightning-input
              name="fileName"
              label="添付ファイル名"
              value={fileName}
              disabled={isSending}
              onchange={handleDraftChange}
            ></lightning-input>
          </div>

          <template if:true={isResend}>
            <p class="confirm-lead" role="status">
              この見積は送付済みです。実行すると再送されます。
            </p>
          </template>
          <p class="confirm-lead" role="note">{sendFailureRetryNote}</p>
          <template if:true={hasUnavailableMessage}>
            <div class="alert alert_warn" role="alert">
              {unavailableMessage}
            </div>
          </template>
        </section>
      </template>

      <template if:true={errorMessage}>
        <div class="alert alert_error" role="alert">
          {errorMessage}
          <template if:true={showLoadRetry}>
            <button
              type="button"
              class="btn btn_secondary"
              onclick={handleLoadRetry}
            >
              再読み込み
            </button>
          </template>
        </div>
      </template>
    </main>

    <footer class="confirm-footer">
      <template if:true={isSending}>
        <p class="surface-wait" role="status">
          <span class="surface-wait-spin">
            <lightning-spinner
              alternative-text="処理中"
              size="small"
            ></lightning-spinner>
          </span>
          処理中
        </p>
      </template>
      <button
        type="button"
        class="btn btn_secondary"
        disabled={isSending}
        onclick={handleCancel}
      >
        キャンセル
      </button>
      <button
        type="button"
        class="btn btn_primary"
        disabled={sendDisabled}
        onclick={handleSend}
      >
        {sendButtonLabel}
      </button>
    </footer>
  </div>
</template>
