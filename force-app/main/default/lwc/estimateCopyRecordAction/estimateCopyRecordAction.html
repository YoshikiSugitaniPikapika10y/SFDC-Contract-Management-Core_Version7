<template>
  <div class="action-frame">
    <template if:true={hasPermission}>
      <template if:true={hasCopySourceId}>
        <c-estimate-create-wizard
          copy-source-history-id={recordId}
          modal-mode
          onrequestclose={handleRequestClose}
          onestimatesaved={handleEstimateSaved}
        >
        </c-estimate-create-wizard>
      </template>
    </template>
    <template if:false={hasPermission}>
      <div class="slds-p-around_medium slds-text-color_error" role="alert">
        この操作の権限がありません。
      </div>
    </template>
  </div>
</template>
